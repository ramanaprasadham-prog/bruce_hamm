<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Videos — Bruce Hamm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <canvas id="particle-canvas"></canvas>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <img src="https://brucehamm.com/wp-content/uploads/2019/01/bruce-hamm.png" alt="Bruce Hamm" class="brand-logo">
        <span class="brand-text">Bruce Hamm</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="biography.html" class="nav-link">Biography</a>
        <a href="gallery.html" class="nav-link">Gallery</a>
        <a href="music.html" class="nav-link">Music</a>
        <a href="videos.html" class="nav-link active">Videos</a>
        <a href="events.html" class="nav-link">Events</a>
        <a href="lessons.html" class="nav-link">Lessons</a>
        <a href="contact.html" class="nav-link nav-cta">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="page-hero-inner">
        <p class="eyebrow reveal">On Stage</p>
        <h1 class="page-title reveal">Videos</h1>
        <p class="page-subtitle reveal">Watch live performances and concert footage.</p>
      </div>
    </section>

    <section class="page-content page-content-wide">
      <div class="video-grid">
        <article class="video-card reveal">
          <div
            class="video-frame video-lazy"
            data-youtube-id="mV3jfrwBF1M"
            data-youtube-title="Bruce Hamm performance video"
          >
            <button type="button" class="video-play-btn" aria-label="Play Bruce Hamm performance video">
              <img
                src="https://img.youtube.com/vi/mV3jfrwBF1M/hqdefault.jpg"
                alt="Bruce Hamm performance video thumbnail"
                loading="lazy"
              >
              <span class="video-play-icon" aria-hidden="true"></span>
            </button>
          </div>
          <p class="video-fallback">
            <a href="https://www.youtube.com/watch?v=mV3jfrwBF1M" target="_blank" rel="noopener noreferrer">
              Watch on YouTube
            </a>
          </p>
        </article>

        <article class="video-card reveal">
          <div
            class="video-frame video-lazy"
            data-youtube-id="_OTR5QUcVR8"
            data-youtube-start="111"
            data-youtube-title="Bruce Hamm performance video"
          >
            <button type="button" class="video-play-btn" aria-label="Play Bruce Hamm performance video">
              <img
                src="https://img.youtube.com/vi/_OTR5QUcVR8/hqdefault.jpg"
                alt="Bruce Hamm performance video thumbnail"
                loading="lazy"
              >
              <span class="video-play-icon" aria-hidden="true"></span>
            </button>
          </div>
          <p class="video-fallback">
            <a href="https://www.youtube.com/watch?v=_OTR5QUcVR8&t=111s" target="_blank" rel="noopener noreferrer">
              Watch on YouTube
            </a>
          </p>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Bruce Hamm. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
